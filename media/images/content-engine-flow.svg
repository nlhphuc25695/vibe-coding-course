  <text x="70" y="135" class="label">1. Brief</text>
  <text x="60" y="165" class="text">Input: Muc tieu, audience, CTA</text>

  <rect x="290" y="100" width="210" height="170" rx="14" ry="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>

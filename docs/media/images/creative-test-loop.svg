  <circle cx="240" cy="520" r="90" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="205" y="515" class="label">Decision</text>
  <text x="190" y="540" class="text">Keep/Iterate/Drop</text>

  <circle cx="240" cy="300" r="90" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="205" y="295" class="label">Update</text>
  <text x="182" y="320" class="text">Cap nhat rule test</text>

  <line x1="580" y1="210" x2="680" y2="260" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="760" y1="390" x2="760" y2="430" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="680" y1="560" x2="580" y2="600" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="420" y1="600" x2="320" y2="560" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="240" y1="430" x2="240" y2="390" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="320" y1="260" x2="420" y2="210" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

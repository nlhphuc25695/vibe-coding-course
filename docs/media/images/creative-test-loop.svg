      .text{font:500 14px Arial,sans-serif;fill:#1f2937}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1000" height="720" fill="#f8fafc"/>
  <text x="40" y="52" class="title">Creative Test Tracker - Vong lap toi uu</text>

  <circle cx="500" cy="170" r="90" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="455" y="165" class="label">Hypothesis</text>
  <text x="438" y="190" class="text">Gia thuyet + KPI</text>

  <circle cx="760" cy="300" r="90" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="730" y="295" class="label">Variants</text>
  <text x="716" y="320" class="text">Tao bien the</text>

  <circle cx="760" cy="520" r="90" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>

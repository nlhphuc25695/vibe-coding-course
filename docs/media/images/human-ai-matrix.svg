<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <style>
      .title{font:700 26px Arial,sans-serif;fill:#111827}
      .axis{font:600 18px Arial,sans-serif;fill:#374151}
      .label{font:700 20px Arial,sans-serif;fill:#111827}
      .text{font:500 15px Arial,sans-serif;fill:#1f2937}
    </style>
  </defs>
  <rect x="0" y="0" width="1000" height="700" fill="#f9fafb"/>
  <text x="40" y="50" class="title">Ma tran Human vs AI cho task marketing</text>

  <line x1="120" y1="610" x2="920" y2="610" stroke="#4b5563" stroke-width="3"/>
  <line x1="120" y1="610" x2="120" y2="110" stroke="#4b5563" stroke-width="3"/>

  <line x1="520" y1="610" x2="520" y2="110" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="120" y1="360" x2="920" y2="360" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 6"/>

  <text x="350" y="655" class="axis">Do lap lai task -> cao dan</text>
  <g transform="translate(45,420) rotate(-90)">
    <text class="axis">Rui ro thuong hieu / phap ly -> cao dan</text>
  </g>

  <rect x="150" y="140" width="340" height="200" rx="14" ry="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="175" y="180" class="label">Human lam chinh</text>
  <text x="175" y="215" class="text">- Quyet dinh chien luoc</text>
  <text x="175" y="240" class="text">- Thong diep nhay cam</text>
  <text x="175" y="265" class="text">- Phe duyet cuoi cung</text>

  <rect x="550" y="140" width="340" height="200" rx="14" ry="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="575" y="180" class="label">AI ho tro + Human duyet</text>
  <text x="575" y="215" class="text">- Draft email/ads copy</text>
  <text x="575" y="240" class="text">- Tong hop insight</text>
  <text x="575" y="265" class="text">- Goi y test creative</text>

  <rect x="150" y="390" width="340" height="190" rx="14" ry="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="175" y="430" class="label">Khong uu tien tu dong hoa</text>
  <text x="175" y="465" class="text">- Task hiem khi lap lai</text>
  <text x="175" y="490" class="text">- Loi ich automation thap</text>

  <rect x="550" y="390" width="340" height="190" rx="14" ry="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="575" y="430" class="label">AI lam chinh</text>
  <text x="575" y="465" class="text">- Tao bien the noi dung</text>
  <text x="575" y="490" class="text">- Phan loai lead co quy tac</text>
  <text x="575" y="515" class="text">- Bao cao dinh ky</text>
</svg>
